name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run format check
        run: npm run format:check

      - name: Run lint
        run: npm run lint

  unit-api-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and API tests
        run: npm test

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production build
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [lint, unit-api-tests, build, docker-build]

    env:
      APP_ENV: ${{ github.event.inputs.environment || 'staging' }}
      STAGING_URL: ${{ secrets.STAGING_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify secret existes
        run: |
          if [ -z "${{ secrets.TEST_API_KEY }}" ]; then
            echo "TEST_API_KEY secret is not set. Please set it in the repository settings."
            exit 1
          fi
          echo "TEST_API_KEY secret is set."

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Show environment variables
        run: echo "Running pipeline for $APP_ENV environment"

      - name: Run Playwright E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 5

      - name: Add E2E summary
        if: always()
        run: |
          echo "## E2E Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: $APP_ENV" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright report uploaded as artifact: playwright-report" >> $GITHUB_STEP_SUMMARY
          echo "- Job status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY

  deploy-simulation:
    runs-on: ubuntu-latest
    needs: [e2e-tests]

    if: github.event_name == 'workflow_dispatch'

    environment:
      name: ${{ github.event.inputs.environment }}

    steps:
      - name: Show deployment target
        run: echo "Deploying to ${{ github.event.inputs.environment }}"

      - name: Simulate deployment
        run: |
          echo "Starting deployment..."
          echo "Running smoke checks..."
          echo "Deployment simulation completed successfully."

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, unit-api-tests, build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t qa-ci-lab .
